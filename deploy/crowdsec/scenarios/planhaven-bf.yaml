# Bans an address after repeated failed sign-ins, second-factor failures, rate-limit hits or
# failed share-link opens (unknown links, wrong PINs).
type: leaky
name: planhaven/planhaven-bf
description: "Detect brute force against PlanHaven sign-in"
filter: "evt.Meta.log_type in ['planhaven_login_failed', 'planhaven_mfa_failed', 'planhaven_rate_limited', 'planhaven_share_link_failed'] && evt.Meta.source_ip != ''"
groupby: evt.Meta.source_ip
capacity: 10
leakspeed: 1m
blackhole: 5m
labels:
  service: planhaven
  type: bruteforce
  remediation: true
