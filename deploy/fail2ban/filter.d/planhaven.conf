# fail2ban filter for PlanHaven's security log (/config/logs/security.log).
# Each line is one JSON object; see backend/app/core/security_log.py for the format.
[Definition]
failregex = ^\{"ts": "[^"]+", "event": "(?:login_failed|mfa_failed|rate_limited)", "ip": "<HOST>"
ignoreregex =
datepattern = ^\{"ts": "%%Y-%%m-%%dT%%H:%%M:%%S
