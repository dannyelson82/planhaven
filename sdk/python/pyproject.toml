[project]
name = "planhaven-sdk"
version = "1.0.0"
description = "The Planhaven plugin API: the only interface plugins may use (ARCHITECTURE.md §14)."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "planhaven_sdk"
module-root = ""
