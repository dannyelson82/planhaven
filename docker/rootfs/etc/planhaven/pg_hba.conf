# PlanHaven PostgreSQL client authentication. Managed by the image; do not edit.
# PostgreSQL listens on a Unix socket only, so there are no "host" lines: TCP is impossible.
#
# The postgres superuser is reachable only by the OS postgres user (peer).
# The app roles are reachable only by processes that can open the socket directory
# /run/postgresql, which is mode 0750 with group PGID: the postgres user and the app user.
# Other users in the container (e.g. the document extractor, SECURITY.md §7.6) cannot.
# TYPE  DATABASE   USER                          METHOD
local   all        postgres                      peer
local   planhaven  planhaven_owner,planhaven_app trust
