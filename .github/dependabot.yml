# Automated dependency updates (SECURITY.md §8). Security updates are also enabled in the
# repository settings. The 7-day cooldown matches frontend/.npmrc: brand-new releases are
# where most malicious packages are caught.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Must match the Node major we run (24 LTS); bumped together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Stays on the major the official Vite template uses (currently 6).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
